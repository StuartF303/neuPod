<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Classic feedback panel</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #181818; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: linear-gradient(#fdfdfd, #dcdfe3 50%, #c6cad0 51%, #b6bbc2); border-bottom: 1px solid #8c9199">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #3a3d42"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#3a3d42"><path d="M6 3l14 9-14 9z"/></svg></div>
    <div style="font-size: 26px">Bluetooth</div>
    <div style="display: flex; justify-content: flex-end; align-items: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1858c8" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid #5d626a; border-radius: 4px; background: #f4f5f6"><div style="width: 78%; height: 100%; border-radius: 1px; background: linear-gradient(#c9f5a3, #63c62f 45%, #3f9c1c 55%, #58b82a)"></div></div>
      <div style="width: 4px; height: 10px; background: #5d626a; border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; position: relative">
    <div aria-hidden="true" style="display: flex; flex-direction: column; font-size: 26px; color: #181818">
      <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 19px"><span>Bluetooth</span><span style="font-size: 22px; color: #606060">On</span></div>
      <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 19px"><span>Audio output</span><span style="font-size: 22px; color: #606060">Auto</span></div>
      <div style="height: 56px; display: flex; align-items: center; padding: 0 19px"><span>Devices</span></div>
      <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 19px"><span>Absolute volume</span><span style="font-size: 22px; color: #606060">On</span></div>
    </div>
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(40,44,52,.45)">
      <div style="width: 452px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #6f757d; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.4); overflow: hidden">
        <div style="padding: 12px 20px; font-size: 26px; line-height: 29px; text-align: center; background: linear-gradient(#fdfdfd, #dcdfe3 50%, #c6cad0 51%, #b6bbc2); border-bottom: 1px solid #8c9199">Paired, but not saved</div>
        <div style="padding: 16px 20px 18px; font-size: 22px; line-height: 28px; color: #3a3d42; text-align: center">The card is read-only, so this headset will be forgotten when the player switches off.</div>
        <div style="height: 52px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #ffffff; text-shadow: 0 1px 0 rgba(0,0,0,.3); background: linear-gradient(#6db3f5, #2f80e0 50%, #1b62cf 51%, #1858c8)">OK</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
