<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Modern Music menu</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; color: #f0f0f0; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden; background: linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.5)), radial-gradient(120% 90% at 85% 20%, rgba(217,115,78,.45), rgba(217,115,78,0) 60%), radial-gradient(110% 100% at 10% 100%, rgba(30,70,110,.75), rgba(22,50,79,0) 65%), #050608">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: rgba(10,10,12,.5); border-bottom: 1px solid rgba(255,255,255,.1)">
    <div style="display: flex; align-items: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="2" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg></div>
    <div style="font-size: 26px">Music</div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid rgba(255,255,255,.6); border-radius: 8px"><div style="width: 78%; height: 100%; border-radius: 4px; background: linear-gradient(#8cecb4, #30b870)"></div></div>
      <div style="width: 3px; height: 9px; background: rgba(255,255,255,.6); border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; display: flex; min-height: 0">
    <div style="width: 336px; flex: none; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 6px; font-size: 26px; background: rgba(0,0,0,.38); border-right: 1px solid rgba(255,255,255,.08)">
      <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Cover Flow</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
      <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Playlists</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
      <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Artists</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
      <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 13px; border-radius: 14px; color: #ffffff; background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,0) 55%), #b8502c; box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28)"><span>Albums</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
      <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Songs</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
      <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Genres</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
      <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Compilations</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
    </div>
    <div style="flex: 1; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 22px 22px 0">
      <div role="img" aria-label="Four album covers, placeholders" style="width: 220px; height: 220px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="border-radius: 12px; background: linear-gradient(135deg, #5a3e1b 50%, #e9c46a 50%); box-shadow: 0 8px 18px rgba(0,0,0,.55)"></div>
        <div style="border-radius: 12px; background: linear-gradient(135deg, #264653 50%, #e76f51 50%); box-shadow: 0 8px 18px rgba(0,0,0,.55)"></div>
        <div style="border-radius: 12px; background: linear-gradient(135deg, #1d3557 50%, #a8dadc 50%); box-shadow: 0 8px 18px rgba(0,0,0,.55)"></div>
        <div style="border-radius: 12px; background: linear-gradient(135deg, #6d597a 50%, #eaac8b 50%); box-shadow: 0 8px 18px rgba(0,0,0,.55)"></div>
      </div>
      <div style="margin-top: 16px; font-size: 26px; line-height: 29px">Albums</div>
      <div style="font-size: 22px; line-height: 24px; color: #c4c4c4">A to Z</div>
    </div>
  </div>
</div>
</body>
</html>
