<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Modern Songs</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; color: #f0f0f0; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden; background: linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.5)), radial-gradient(120% 90% at 85% 20%, rgba(217,115,78,.45), rgba(217,115,78,0) 60%), radial-gradient(110% 100% at 10% 100%, rgba(30,70,110,.75), rgba(22,50,79,0) 65%), #050608">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: rgba(10,10,12,.5); border-bottom: 1px solid rgba(255,255,255,.1)">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #b8b8b8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="2" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg><span>1,204</span></div>
    <div style="font-size: 26px">Songs</div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid rgba(255,255,255,.6); border-radius: 8px">
        <div style="width: 78%; height: 100%; border-radius: 4px; background: linear-gradient(#8cecb4, #30b870)"></div>
      </div>
      <div style="width: 3px; height: 9px; background: rgba(255,255,255,.6); border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; display: flex; min-height: 0; background: rgba(0,0,0,.42)">
    <div style="flex: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 6px">
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Carrier Wave</div>
        <div style="font-size: 22px; line-height: 24px; color: #b0b0b0; white-space: nowrap">Beacon · Signal</div>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Café Del Mar</div>
        <div style="font-size: 22px; line-height: 24px; color: #b0b0b0; white-space: nowrap">Aurora Lane · First Light</div>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Ember</div>
        <div style="font-size: 22px; line-height: 24px; color: #b0b0b0; white-space: nowrap">The Cinders · Now 7</div>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px; border-radius: 16px; color: #ffffff; background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,0) 55%), #b8502c; box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28)">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Harbour Lights</div>
        <div style="font-size: 22px; line-height: 24px; color: #ffffff; white-space: nowrap">Aurora Lane · First Light</div>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Hit A</div>
        <div style="font-size: 22px; line-height: 24px; color: #b0b0b0; white-space: nowrap">Zed Zed · Hit A</div>
      </div>
    </div>
    <div aria-hidden="true" style="width: 10px; flex: none; box-sizing: border-box; padding: 6px 3px">
      <div style="margin-top: 150px; height: 70px; border-radius: 2px; background: rgba(255,255,255,.45)"></div>
    </div>
  </div>
</div>
</body>
</html>
