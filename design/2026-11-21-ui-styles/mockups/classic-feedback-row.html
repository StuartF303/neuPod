<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Classic feedback on the row</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #181818; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: linear-gradient(#fdfdfd, #dcdfe3 50%, #c6cad0 51%, #b6bbc2); border-bottom: 1px solid #8c9199">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #3a3d42"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#3a3d42"><path d="M6 3l14 9-14 9z"/></svg><span>1,204</span></div>
    <div style="font-size: 26px">Songs</div>
    <div style="display: flex; justify-content: flex-end; align-items: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3d42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid #5d626a; border-radius: 4px; background: #f4f5f6"><div style="width: 78%; height: 100%; border-radius: 1px; background: linear-gradient(#c9f5a3, #63c62f 45%, #3f9c1c 55%, #58b82a)"></div></div>
      <div style="width: 4px; height: 10px; background: #5d626a; border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
    <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 19px">
      <div>
        <div style="font-size: 26px; line-height: 29px; color: #a0a0a0">Carrier Wave</div>
        <div style="font-size: 22px; line-height: 24px; color: #a0a0a0">Beacon · Signal</div>
      </div>
      <div style="font-size: 22px; line-height: 24px; color: #767676; white-space: nowrap">AAC, can't play</div>
    </div>
    <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 19px; color: #10233f; background: linear-gradient(#d6eafd, #a9d0f8 50%, #93c3f5 51%, #8abdf3)">
      <div>
        <div style="font-size: 26px; line-height: 29px">Café Del Mar</div>
        <div style="font-size: 22px; line-height: 24px">Aurora Lane · First Light</div>
      </div>
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#10233f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 19px">
      <div style="font-size: 26px; line-height: 29px">Ember</div>
      <div style="font-size: 22px; line-height: 24px; color: #606060">The Cinders · Now 7</div>
    </div>
    <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 19px">
      <div style="font-size: 26px; line-height: 29px">Harbour Lights</div>
      <div style="font-size: 22px; line-height: 24px; color: #606060">Aurora Lane · First Light</div>
    </div>
    <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 19px">
      <div style="font-size: 26px; line-height: 29px">Hit A</div>
      <div style="font-size: 22px; line-height: 24px; color: #606060">Zed Zed · Hit A</div>
    </div>
  </div>
</div>
</body>
</html>
