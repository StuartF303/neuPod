<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Modern albums by an artist</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; color: #f0f0f0; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden; background: linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.5)), radial-gradient(120% 90% at 85% 20%, rgba(217,115,78,.45), rgba(217,115,78,0) 60%), radial-gradient(110% 100% at 10% 100%, rgba(30,70,110,.75), rgba(22,50,79,0) 65%), #050608">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: rgba(10,10,12,.5); border-bottom: 1px solid rgba(255,255,255,.1)">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #b8b8b8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="2" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg><span>9 albums</span></div>
    <div style="font-size: 26px">Orbital</div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid rgba(255,255,255,.6); border-radius: 8px"><div style="width: 78%; height: 100%; border-radius: 4px; background: linear-gradient(#8cecb4, #30b870)"></div></div>
      <div style="width: 3px; height: 9px; background: rgba(255,255,255,.6); border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; display: flex; min-height: 0; background: rgba(0,0,0,.42)">
    <div style="flex: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 6px">
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 13px; font-size: 26px"><span>All Songs</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 13px 0 8px">
        <div aria-hidden="true" style="width: 59px; height: 59px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #2b2d42 50%, #8d99ae 50%)"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 26px; line-height: 29px; white-space: nowrap">Orbital</div><div style="font-size: 22px; line-height: 24px; color: #b0b0b0">1991 · 11 songs</div></div>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 13px 0 8px; border-radius: 16px; color: #ffffff; background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,0) 55%), #b8502c; box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28)">
        <div aria-hidden="true" style="width: 59px; height: 59px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #5a3e1b 50%, #e9c46a 50%); box-shadow: 0 2px 6px rgba(0,0,0,.4)"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 26px; line-height: 29px; white-space: nowrap">Orbital 2</div><div style="font-size: 22px; line-height: 24px">1993 · 10 songs</div></div>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 13px 0 8px">
        <div aria-hidden="true" style="width: 59px; height: 59px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #3d405b 50%, #81b29a 50%)"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 26px; line-height: 29px; white-space: nowrap">Diversions</div><div style="font-size: 22px; line-height: 24px; color: #b0b0b0">1994 · 6 songs</div></div>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 13px 0 8px">
        <div aria-hidden="true" style="width: 59px; height: 59px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #264653 50%, #e76f51 50%)"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 26px; line-height: 29px; white-space: nowrap">Snivilisation</div><div style="font-size: 22px; line-height: 24px; color: #b0b0b0">1994 · 10 songs</div></div>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>
    <div aria-hidden="true" style="width: 10px; flex: none; box-sizing: border-box; padding: 6px 3px">
      <div style="height: 170px; border-radius: 2px; background: rgba(255,255,255,.45)"></div>
    </div>
  </div>
</div>
</body>
</html>
