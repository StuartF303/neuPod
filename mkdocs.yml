site_name: neuPod
site_description: Replacement logic board and firmware for the iPod Classic 6G
site_url: https://stuartf303.github.io/neuPod/
repo_url: https://github.com/StuartF303/neuPod
repo_name: StuartF303/neuPod
edit_uri: edit/main/docs/
copyright: Documentation licensed CC BY 4.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Requirements: requirements.md
  - Design: design.md
  - Reference: reference.md
  - UI: ui.md
  - Firmware:
      - Runtime (RTOS, tasks, boot): runtime.md
      - Audio (I2S, tones, WAV): audio.md
      - Bluetooth (BTstack, settings store): bluetooth.md
      - Wi-Fi (lwIP, clock, secrets): wifi.md
      - Wheel input widgets: ui-input.md
      - Innioasis Y2 platform: y2.md
  - Hardware:
      - Phase 1 wiring: wiring-phase1.md
      - Click-wheel protocol: click-wheel-protocol.md
      - Display bring-up tests: display-tests.md
      - microSD storage and tests: storage.md
      - I2C peripherals (fuel gauge, haptics): i2c-peripherals.md
      - Bench practice and test order: bench.md
  - Decisions:
      - adr/index.md
      - ADR-0001 RP2350 as Phase 1 platform: adr/0001-rp2350-phase1-platform.md
      - ADR-0002 ST7789 SPI display: adr/0002-display-st7789-spi-phase1.md
      - ADR-0003 Audio quality policy: adr/0003-audio-quality-policy.md
      - ADR-0004 Donor iPod Classic 6G: adr/0004-donor-ipod-classic-6g.md
      - ADR-0005 Firmware architecture: adr/0005-firmware-architecture.md
      - ADR-0006 Storage microSD SDIO: adr/0006-storage-microsd-sdio.md
      - ADR-0007 Bluetooth audio path: adr/0007-bluetooth-audio-path.md
      - ADR-0008 Card format: adr/0008-card-format.md
      - ADR-0009 RTOS FreeRTOS (amended): adr/0009-rtos-freertos-smp.md
      - ADR-0010 UI toolkit LVGL: adr/0010-ui-lvgl.md
      - ADR-0011 Bare-metal audio core: adr/0011-bare-metal-audio-core.md
      - ADR-0012 Final-board audio codec: adr/0012-audio-codec-final-board.md
      - ADR-0013 BT stage 2 RAM and PSRAM: adr/0013-bluetooth-ram-psram.md
      - ADR-0014 OTA A/B partitions: adr/0014-ota-ab-partitions.md
      - ADR-0015 Clock plan: adr/0015-clock-plan.md
      - ADR-0016 Gapless playback and the play queue: adr/0016-gapless-playback-and-play-queue.md
      - ADR-0017 Music library index: adr/0017-music-library-index.md
      - ADR-0018 UI resolution profiles: adr/0018-ui-resolution-profiles.md
