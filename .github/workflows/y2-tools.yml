name: y2-tools

# Host-side tooling for the Innioasis Y2 testbed. Only the synthetic tests run here;
# the factory-image round trips skip without ~/y2-firmware and are run on the bench box.
on:
  push:
    branches: [main]
    paths: ["testbed/y2/tools/**", "testbed/y2/rescue/**", "testbed/y2/buildroot/**", "testbed/y2/scripts/usb-console.sh", "testbed/y2/scripts/deploy-demo.sh", "testbed/y2/dotnet/**", ".github/workflows/y2-tools.yml"]
  pull_request:
    paths: ["testbed/y2/tools/**", "testbed/y2/rescue/**", "testbed/y2/buildroot/**", "testbed/y2/scripts/usb-console.sh", "testbed/y2/scripts/deploy-demo.sh", "testbed/y2/dotnet/**", ".github/workflows/y2-tools.yml"]
  workflow_dispatch:

jobs:
  y2-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - name: Unit tests (mtk-bootimg)
        run: python3 -I -m unittest discover -s testbed/y2/tools/tests -v
      - name: .NET tests (Y2 demo and platform layer)
        run: dotnet test testbed/y2/dotnet/NeuPod.Y2.slnx -c Release
      - name: Shell syntax
        run: |
          for f in testbed/y2/tools/setup-host.sh testbed/y2/rescue/build-rescue.sh testbed/y2/scripts/usb-console.sh testbed/y2/scripts/deploy-demo.sh testbed/y2/buildroot/board/y2/overlay/etc/init.d/S90neupod-demo; do
            bash -n "$f"
          done
