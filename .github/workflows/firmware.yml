name: firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_VERSION: "2.3.1"

jobs:
  rp2350:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib build-essential python3

      - name: Cache Pico SDK
        id: pico-sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Fetch Pico SDK
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" \
            https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          git -C ~/pico-sdk submodule update --init --depth 1

      - name: Build
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          scripts/build.sh rp2350 --clean

      - uses: actions/upload-artifact@v7
        with:
          name: neupod-rp2350
          path: |
            build/rp2350/platforms/rp2350/*.uf2
            build/rp2350/platforms/rp2350/*.elf
          if-no-files-found: error

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential libsdl2-dev
      - name: Build
        run: scripts/build.sh host --clean
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  esp32s3:
    # Allowed to fail until the ESP-IDF skeleton has been built for real.
    continue-on-error: true
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          scripts/build.sh esp32s3
