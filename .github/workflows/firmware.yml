name: firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

# rp2350, host and y2 run in the toolchain image built from .github/ci/Dockerfile (Pico SDK included, PICO_SDK_PATH set).
# To bump it: merge a Dockerfile change, copy the digest from the ci-image run summary into the three image: lines.

jobs:
  rp2350:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/stuartf303/neupod-ci@sha256:c0c5bbfc35037dc78a9897cf5104690fe53ab83d539054c5b7696217e2334f46 # 2026-11-11 first published image
    steps:
      - uses: actions/checkout@v7
      # Explicit, non-recursive: FreeRTOS-Kernel's own nested submodules (community ports) are not needed.
      - name: Fetch submodules
        run: git submodule update --init lib/no-OS-FatFS-SD-SDIO-SPI-RPi-Pico lib/FreeRTOS-Kernel lib/lvgl

      - name: Toolchain versions
        run: cat /etc/neupod-ci-versions

      - name: Build
        run: |
          scripts/build.sh rp2350 --clean -- -DNEUPOD_REQUIRE_CRYPTO=ON

      - uses: actions/upload-artifact@v7
        with:
          name: neupod-rp2350
          path: |
            build/rp2350/platforms/rp2350/*.uf2
            build/rp2350/platforms/rp2350/*.elf
          if-no-files-found: error

      # Debug leaves assert() enabled in the SDK; the core-1 closure check (a post-build step) must hold there too.
      # Same script and flags as the Release build; after the upload so the artifact stays the Release image.
      - name: Build (Debug, core-1 closure check)
        run: |
          scripts/build.sh rp2350 --clean -- -DNEUPOD_REQUIRE_CRYPTO=ON -DCMAKE_BUILD_TYPE=Debug

  host:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/stuartf303/neupod-ci@sha256:c0c5bbfc35037dc78a9897cf5104690fe53ab83d539054c5b7696217e2334f46 # 2026-11-11 first published image
    steps:
      - uses: actions/checkout@v7
      - name: Fetch submodules
        run: git submodule update --init lib/FreeRTOS-Kernel lib/lvgl
      - name: Toolchain versions
        run: cat /etc/neupod-ci-versions
      - name: Build
        run: |
          scripts/build.sh host --clean -- -DNEUPOD_REQUIRE_CRYPTO=ON
      - name: Test
        run: ctest --test-dir build/host --output-on-failure -j3

  # Compile check of the Innioasis Y2 target (docs/y2.md). The device binary is built with the Buildroot toolchain from the
  # rootfs; CI cannot have that, so it cross-builds with Ubuntu's armhf gcc and only checks that the
  # result is a 32-bit ARM hard-float executable. The Y2's portable logic is unit-tested by the host job (ctest -R y2_).
  y2:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/stuartf303/neupod-ci@sha256:c0c5bbfc35037dc78a9897cf5104690fe53ab83d539054c5b7696217e2334f46 # 2026-11-11 first published image
    steps:
      - uses: actions/checkout@v7
      - name: Fetch submodules
        run: git submodule update --init lib/FreeRTOS-Kernel lib/lvgl
      - name: Toolchain versions
        run: cat /etc/neupod-ci-versions
      - name: Cross-build
        run: |
          export NEUPOD_Y2_TOOLCHAIN=/usr NEUPOD_Y2_TRIPLE=arm-linux-gnueabihf
          scripts/build.sh y2 --clean -- -DCMAKE_BUILD_TYPE=Release -DNEUPOD_REQUIRE_CRYPTO=ON
      - name: Check the result is an armhf executable
        run: |
          file build/y2/platforms/y2/neupod | tee /dev/stderr | grep -q "ELF 32-bit LSB.*ARM.*EABI5"
          arm-linux-gnueabihf-readelf -A build/y2/platforms/y2/neupod | grep -q "Tag_ABI_VFP_args: VFP registers"
      # The Bluetooth bring-up tool (testbed/y2/tools/y2-a2dp) uses BTstack from the Pico SDK in the image. A PC build runs its
      # unit tests; the armhf build is the same static executable the Buildroot toolchain produces for the device.
      - name: y2-a2dp tests (PC build)
        run: |
          cmake -S testbed/y2/tools/y2-a2dp -B build/y2-a2dp-host
          cmake --build build/y2-a2dp-host -j3
          ctest --test-dir build/y2-a2dp-host --output-on-failure
      - name: y2-a2dp cross-build
        run: |
          export NEUPOD_Y2_TOOLCHAIN=/usr NEUPOD_Y2_TRIPLE=arm-linux-gnueabihf
          cmake -S testbed/y2/tools/y2-a2dp -B build/y2-a2dp -DY2A2DP_TARGET=y2
          cmake --build build/y2-a2dp -j3
          file build/y2-a2dp/y2-a2dp | tee /dev/stderr | grep -q "ELF 32-bit LSB.*ARM.*EABI5.*statically linked"

  esp32s3:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          scripts/build.sh esp32s3
