name: firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_VERSION: "2.3.1"

jobs:
  rp2350:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Explicit, non-recursive: FreeRTOS-Kernel's own nested submodules (community ports) are not needed.
      - name: Fetch submodules
        run: git submodule update --init lib/no-OS-FatFS-SD-SDIO-SPI-RPi-Pico lib/FreeRTOS-Kernel lib/lvgl

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib build-essential python3

      - name: Cache Pico SDK
        id: pico-sdk-cache
        uses: actions/cache@v6
        with:
          path: ~/pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Fetch Pico SDK
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" \
            https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          git -C ~/pico-sdk submodule update --init --depth 1

      - name: Build
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          scripts/build.sh rp2350 --clean -- -DNEUPOD_REQUIRE_CRYPTO=ON

      # Debug leaves assert() enabled in the SDK; the core-1 closure check (a post-build step) must hold there too.
      - name: Build (Debug, core-1 closure check)
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          cmake -S . -B build/rp2350-debug -G Ninja -DNEUPOD_PLATFORM=rp2350 -DCMAKE_BUILD_TYPE=Debug -DNEUPOD_REQUIRE_CRYPTO=ON
          ninja -C build/rp2350-debug

      - uses: actions/upload-artifact@v7
        with:
          name: neupod-rp2350
          path: |
            build/rp2350/platforms/rp2350/*.uf2
            build/rp2350/platforms/rp2350/*.elf
          if-no-files-found: error

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch submodules
        run: git submodule update --init lib/FreeRTOS-Kernel lib/lvgl
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential libsdl2-dev
      - name: Fetch mbed TLS (only that submodule of the Pico SDK; the secrets code and its tests need it)
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          git -C ~/pico-sdk submodule update --init --depth 1 lib/mbedtls
      - name: Build
        run: |
          export PICO_SDK_PATH=$HOME/pico-sdk
          scripts/build.sh host --clean -- -DNEUPOD_REQUIRE_CRYPTO=ON
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  esp32s3:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          scripts/build.sh esp32s3
