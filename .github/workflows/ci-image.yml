name: ci-image

# Builds the toolchain container the firmware jobs run in (.github/ci/Dockerfile) and pushes it to ghcr.io.
# After a new image lands, bump the digest in firmware.yml (see CONTRIBUTING.md, "CI toolchain image").

on:
  push:
    branches: [main]
    paths:
      - ".github/ci/**"
      - "scripts/ci-apt.sh"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *" # monthly, picks up Ubuntu security updates

concurrency:
  group: ci-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/stuartf303/neupod-ci

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Tags
        id: tags
        run: |
          echo "list=$IMAGE:sha-${GITHUB_SHA::7},$IMAGE:$(date -u +%Y%m%d),$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/ci/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # The monthly run exists to pick up package updates, so it must not reuse the cached apt layer.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest to pin in firmware.yml
        run: |
          {
            echo "### CI image pushed"
            echo
            echo "Pin in .github/workflows/firmware.yml: \`$IMAGE@${{ steps.build.outputs.digest }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
