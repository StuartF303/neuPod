name: app

# The neuPod phone app (mobile/, docs/app/README.md "How it is tested"): Android builds and tests on Linux, iOS on a
# GitHub-hosted Mac. No secrets and no signing: debug builds only, iOS with --no-codesign.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # every run on main completes

# Flutter as in docs/app/ENVIRONMENT.md. Third-party actions are pinned by commit SHA; the comment names the release.
env:
  FLUTTER_VERSION: "3.50.1"

defaults:
  run:
    working-directory: mobile

jobs:
  # Formatting, static analysis, unit and widget tests.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  # Debug APK, and the privacy check: the merged release manifest must not ask for INTERNET (R1 makes no network
  # connection; Flutter adds INTERNET only to the debug and profile manifests, for the tool).
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/app/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      # The Flutter build above writes android/local.properties and the Gradle wrapper that this step needs.
      - name: Release manifest has no network permission
        run: |
          (cd android && ./gradlew --no-daemon :app:processReleaseMainManifest)
          manifest=build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          if [ ! -f "$manifest" ]; then
            echo "::error::merged release manifest not found at mobile/$manifest"
            find build/app/intermediates -name AndroidManifest.xml -path '*release*' || true
            exit 1
          fi
          grep -n 'uses-permission' "$manifest" || true
          # ACCESS_NETWORK_STATE comes in with Media3; the audio plugin's manifest removes it.
          for permission in INTERNET ACCESS_NETWORK_STATE; do
            if grep -q "\"android.permission.$permission\"" "$manifest"; then
              echo "::error::the release manifest asks for android.permission.$permission; R1 makes no network connection"
              exit 1
            fi
          done
          echo "OK: no INTERNET or ACCESS_NETWORK_STATE permission in the release manifest"

  # Integration tests on an emulator at the minimum API level (29, Android 10).
  android-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/app/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      # Build once before the emulator starts, so Gradle's downloads and first compile don't compete with it.
      - run: flutter build apk --debug
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: mobile
          script: flutter test integration_test -d emulator-5554

  # iOS: simulator build without signing, then the integration tests on an iPhone simulator. macos-26 is Apple
  # silicon; Xcode 26.5 is the version on the owner's Mac (docs/app/ENVIRONMENT.md) and ships the iOS 26.5 simulator.
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
      - name: Boot an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"] // [] | map(select(.name == "iPhone 17")) | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::no iPhone 17 simulator with iOS 26.5"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # A normal run takes about 7 minutes. On the hosted runner the install or launch on the simulator has been seen to
      # hang once (simctl never returned), so the step is time-boxed and retried once. A real test failure fails both.
      # Verbose, so the log shows where a hang happened.
      - name: Integration tests
        id: integration
        timeout-minutes: 12
        continue-on-error: true
        run: flutter test integration_test -v -d "${{ steps.sim.outputs.udid }}"
      - name: Integration tests (retry)
        if: steps.integration.outcome == 'failure'
        timeout-minutes: 12
        run: |
          echo "::warning::iOS integration tests failed or timed out on the first attempt; retrying once"
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          flutter test integration_test -v -d "${{ steps.sim.outputs.udid }}"
      - name: Simulator state on failure
        if: failure() || steps.integration.outcome == 'failure'
        run: |
          xcrun simctl list devices booted
          xcrun simctl spawn booted log show --last 10m --style compact --predicate 'process == "Runner"' | tail -200 || true
