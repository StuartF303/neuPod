name: Bug report
description: Something in the firmware, tools or docs doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [rp2350, esp32s3, host, n/a]
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / version
      placeholder: git rev-parse --short HEAD
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output / logs
      render: text
