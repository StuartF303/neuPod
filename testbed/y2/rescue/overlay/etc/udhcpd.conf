# Template: init substitutes the interface name into /tmp/udhcpd.conf at boot.
# Offers the host exactly 192.168.7.1/24 and nothing else (no router, no DNS).
start 192.168.7.1
end 192.168.7.1
interface @IFACE@
max_leases 1
lease_file /tmp/udhcpd.leases
pidfile /tmp/udhcpd.pid
option subnet 255.255.255.0
option lease 3600
