# busybox mdev rules. Syntax: <devname-regex> <uid>:<gid> <mode> [@cmd]; first match wins.
# mdev takes the node name from the kernel's DEVNAME (so input devices land in /dev/input/).
fb[0-9]+        0:0 660 @mkdir -p /dev/graphics && ln -sf ../$MDEV /dev/graphics/$MDEV
mmcblk.*        0:0 660
ttyGS[0-9]+     0:0 660
ttyACM[0-9]+    0:0 660
input/.*        0:0 660
tty[0-9]*       0:0 660
ptmx            0:0 666
null            0:0 666
zero            0:0 666
random          0:0 666
urandom         0:0 666
.*              0:0 660
