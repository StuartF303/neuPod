<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Artists list: one artist per row, selection bar, scroll indicator on the right">
  <style>text{font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1d1d1b}</style>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/><stop offset="1" stop-color="#d9d9d4"/>
    </linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9df0"/><stop offset="1" stop-color="#2663c6"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6b8a"/><stop offset="1" stop-color="#1e2a44"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8743a"/><stop offset="1" stop-color="#4a2a10"/>
    </linearGradient>
    <linearGradient id="art3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8a6b"/><stop offset="1" stop-color="#143324"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="320" height="240" fill="#ffffff"/>
  <rect x="0" y="0" width="320" height="24" fill="url(#bar)"/>
  <line x1="0" y1="24" x2="320" y2="24" stroke="#b9b9b3" stroke-width="1"/>
  <text x="160" y="17" text-anchor="middle" font-size="13" font-weight="600">Artists</text>
  <!-- battery -->
  <rect x="289" y="7" width="22" height="10" rx="2" fill="none" stroke="#5b5a56" stroke-width="1"/>
  <rect x="290.5" y="8.5" width="15" height="7" rx="1" fill="#3fa34d"/>
  <rect x="311" y="10" width="2" height="4" fill="#5b5a56"/>
  <text x="10" y="40.2" font-size="12.5" fill="#1d1d1b">All Albums</text>
  <text x="298" y="40.2" font-size="12.5" text-anchor="end" fill="#1d1d1b">›</text>
  <text x="10" y="64.2" font-size="12.5" fill="#1d1d1b">Aphex Twin</text>
  <text x="298" y="64.2" font-size="12.5" text-anchor="end" fill="#1d1d1b">›</text>
  <text x="10" y="88.2" font-size="12.5" fill="#1d1d1b">Beck</text>
  <text x="298" y="88.2" font-size="12.5" text-anchor="end" fill="#1d1d1b">›</text>
  <rect x="0" y="96" width="308" height="24" fill="url(#sel)"/>
  <text x="10" y="112.2" font-size="12.5" fill="#ffffff">Boards of Canada</text>
  <text x="298" y="112.2" font-size="12.5" text-anchor="end" fill="#ffffff">›</text>
  <text x="10" y="136.2" font-size="12.5" fill="#1d1d1b">Björk</text>
  <text x="298" y="136.2" font-size="12.5" text-anchor="end" fill="#1d1d1b">›</text>
  <text x="10" y="160.2" font-size="12.5" fill="#1d1d1b">Blur</text>
  <text x="298" y="160.2" font-size="12.5" text-anchor="end" fill="#1d1d1b">›</text>
  <text x="10" y="184.2" font-size="12.5" fill="#1d1d1b">Bonobo</text>
  <text x="298" y="184.2" font-size="12.5" text-anchor="end" fill="#1d1d1b">›</text>
  <text x="10" y="208.2" font-size="12.5" fill="#1d1d1b">Burial</text>
  <text x="298" y="208.2" font-size="12.5" text-anchor="end" fill="#1d1d1b">›</text>
  <text x="10" y="232.2" font-size="12.5" fill="#1d1d1b">Caribou</text>
  <text x="298" y="232.2" font-size="12.5" text-anchor="end" fill="#1d1d1b">›</text>
  <rect x="310" y="26" width="8" height="212" rx="4" fill="#e6e6e2"/>
  <rect x="311" y="40" width="6" height="40" rx="3" fill="#8f8f89"/>

</svg>
