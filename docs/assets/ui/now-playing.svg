<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Now playing: artwork on the left, track, artist and album on the right, progress bar below">
  <style>text{font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#1d1d1b}</style>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f5"/><stop offset="1" stop-color="#d9d9d4"/>
    </linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9df0"/><stop offset="1" stop-color="#2663c6"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6b8a"/><stop offset="1" stop-color="#1e2a44"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8743a"/><stop offset="1" stop-color="#4a2a10"/>
    </linearGradient>
    <linearGradient id="art3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8a6b"/><stop offset="1" stop-color="#143324"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="320" height="240" fill="#ffffff"/>
  <rect x="0" y="0" width="320" height="24" fill="url(#bar)"/>
  <line x1="0" y1="24" x2="320" y2="24" stroke="#b9b9b3" stroke-width="1"/>
  <text x="160" y="17" text-anchor="middle" font-size="13" font-weight="600">Now Playing</text>
  <!-- battery -->
  <rect x="289" y="7" width="22" height="10" rx="2" fill="none" stroke="#5b5a56" stroke-width="1"/>
  <rect x="290.5" y="8.5" width="15" height="7" rx="1" fill="#3fa34d"/>
  <rect x="311" y="10" width="2" height="4" fill="#5b5a56"/>
  <text x="306" y="17" text-anchor="end" font-size="11" fill="#5b5a56"></text>
  <text x="14" y="17" font-size="11" fill="#5b5a56">3 of 12</text>
  <rect x="14" y="40" width="120" height="120" rx="3" fill="url(#art)"/>
  <circle cx="74.0" cy="100.0" r="26.4" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3.5999999999999996"/>
  <circle cx="74.0" cy="100.0" r="6.0" fill="#ffffff" fill-opacity="0.5"/>
  <text x="150" y="70" font-size="14" font-weight="600">Track title</text>
  <text x="150" y="90" font-size="12" fill="#5b5a56">Artist name</text>
  <text x="150" y="108" font-size="12" fill="#5b5a56">Album name</text>
  <text x="150" y="130" font-size="10" fill="#8f8f89">FLAC 24/96 · wired · bit-perfect</text>
  <rect x="14" y="186" width="292" height="10" rx="5" fill="#e6e6e2"/>
  <rect x="14" y="186" width="118" height="10" rx="5" fill="url(#sel)"/>
  <text x="14" y="214" font-size="11" fill="#5b5a56">1:42</text>
  <text x="306" y="214" font-size="11" text-anchor="end" fill="#5b5a56">-2:35</text>
  <text x="160" y="214" font-size="11" text-anchor="middle" fill="#5b5a56">▶</text>

</svg>
