<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Classic albums by an artist</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #181818; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: linear-gradient(#fdfdfd, #dcdfe3 50%, #c6cad0 51%, #b6bbc2); border-bottom: 1px solid #8c9199">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #3a3d42"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#3a3d42"><path d="M6 3l14 9-14 9z"/></svg><span>9 albums</span></div>
    <div style="font-size: 26px">Orbital</div>
    <div style="display: flex; justify-content: flex-end; align-items: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3d42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid #5d626a; border-radius: 4px; background: #f4f5f6"><div style="width: 78%; height: 100%; border-radius: 1px; background: linear-gradient(#c9f5a3, #63c62f 45%, #3f9c1c 55%, #58b82a)"></div></div>
      <div style="width: 4px; height: 10px; background: #5d626a; border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; display: flex; min-height: 0">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 19px; font-size: 26px"><span>All Songs</span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 19px 0 8px">
        <div aria-hidden="true" style="width: 59px; height: 59px; flex: none; background: linear-gradient(135deg, #2b2d42 50%, #8d99ae 50%); box-shadow: 0 1px 3px rgba(0,0,0,.35)"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 26px; line-height: 29px; white-space: nowrap">Orbital</div><div style="font-size: 22px; line-height: 24px; color: #606060">1991 · 11 songs</div></div>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 19px 0 8px; color: #ffffff; text-shadow: 0 1px 0 rgba(0,0,0,.3); background: linear-gradient(#6db3f5, #2f80e0 50%, #1b62cf 51%, #1858c8)">
        <div aria-hidden="true" style="width: 59px; height: 59px; flex: none; background: linear-gradient(135deg, #5a3e1b 50%, #e9c46a 50%); box-shadow: 0 1px 3px rgba(0,0,0,.45)"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 26px; line-height: 29px; white-space: nowrap">Orbital 2</div><div style="font-size: 22px; line-height: 24px">1993 · 10 songs</div></div>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 19px 0 8px">
        <div aria-hidden="true" style="width: 59px; height: 59px; flex: none; background: linear-gradient(135deg, #3d405b 50%, #81b29a 50%); box-shadow: 0 1px 3px rgba(0,0,0,.35)"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 26px; line-height: 29px; white-space: nowrap">Diversions</div><div style="font-size: 22px; line-height: 24px; color: #606060">1994 · 6 songs</div></div>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 19px 0 8px">
        <div aria-hidden="true" style="width: 59px; height: 59px; flex: none; background: linear-gradient(135deg, #264653 50%, #e76f51 50%); box-shadow: 0 1px 3px rgba(0,0,0,.35)"></div>
        <div style="flex: 1; min-width: 0"><div style="font-size: 26px; line-height: 29px; white-space: nowrap">Snivilisation</div><div style="font-size: 22px; line-height: 24px; color: #606060">1994 · 10 songs</div></div>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>
    <div aria-hidden="true" style="width: 14px; flex: none; box-sizing: border-box; padding: 3px; background: linear-gradient(90deg, #d5d8dc, #f1f2f4); border-left: 1px solid #b9bdc4">
      <div style="height: 170px; border-radius: 4px; background: linear-gradient(90deg, #8fc3f6, #2f80e0 60%, #1858c8)"></div>
    </div>
  </div>
</div>
</body>
</html>
