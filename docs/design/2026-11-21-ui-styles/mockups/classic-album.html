<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Classic album</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #181818; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: linear-gradient(#fdfdfd, #dcdfe3 50%, #c6cad0 51%, #b6bbc2); border-bottom: 1px solid #8c9199">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #3a3d42"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#3a3d42"><path d="M6 3l14 9-14 9z"/></svg></div>
    <div style="font-size: 26px">Orbital 2</div>
    <div style="display: flex; justify-content: flex-end; align-items: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3d42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid #5d626a; border-radius: 4px; background: #f4f5f6"><div style="width: 78%; height: 100%; border-radius: 1px; background: linear-gradient(#c9f5a3, #63c62f 45%, #3f9c1c 55%, #58b82a)"></div></div>
      <div style="width: 4px; height: 10px; background: #5d626a; border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="height: 121px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 18px; padding: 0 19px; background: linear-gradient(#f3f4f6, #e3e6e9); border-bottom: 1px solid #b9bdc4">
    <div role="img" aria-label="Album art placeholder" style="width: 96px; height: 96px; flex: none; background: linear-gradient(135deg, #5a3e1b 50%, #e9c46a 50%); box-shadow: 0 2px 5px rgba(0,0,0,.4)"></div>
    <div style="min-width: 0">
      <div style="font-size: 38px; line-height: 41px; white-space: nowrap">Orbital</div>
      <div style="margin-top: 4px; font-size: 22px; line-height: 24px; color: #606060">1993 · 10 songs</div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; font-size: 26px">
    <div style="height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 19px"><span style="width: 30px; text-align: right; font-size: 22px; color: #767676">1</span><span>Time Becomes</span></div>
    <div style="height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 19px; color: #ffffff; text-shadow: 0 1px 0 rgba(0,0,0,.3); background: linear-gradient(#6db3f5, #2f80e0 50%, #1b62cf 51%, #1858c8)"><span style="width: 30px; text-align: right; font-size: 22px">2</span><span>Planet of the Shapes</span></div>
    <div style="height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 19px"><span style="width: 30px; text-align: right; font-size: 22px; color: #767676">3</span><span>Lush 3-1</span></div>
    <div style="height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 19px"><span style="width: 30px; text-align: right; font-size: 22px; color: #767676">4</span><span>Lush 3-2</span></div>
    <div style="height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 19px"><span style="width: 30px; text-align: right; font-size: 22px; color: #767676">5</span><span style="white-space: nowrap">Impact (The Earth Is Burning)</span></div>
  </div>
</div>
</body>
</html>
