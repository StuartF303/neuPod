<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Classic Songs</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #181818; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: linear-gradient(#fdfdfd, #dcdfe3 50%, #c6cad0 51%, #b6bbc2); border-bottom: 1px solid #8c9199">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #3a3d42"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#3a3d42"><path d="M6 3l14 9-14 9z"/></svg><span>1,204</span></div>
    <div style="font-size: 26px">Songs</div>
    <div style="display: flex; justify-content: flex-end; align-items: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3d42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9a9ea5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3d42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid #5d626a; border-radius: 4px; background: #f4f5f6">
        <div style="width: 78%; height: 100%; border-radius: 1px; background: linear-gradient(#c9f5a3, #63c62f 45%, #3f9c1c 55%, #58b82a)"></div>
      </div>
      <div style="width: 4px; height: 10px; background: #5d626a; border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; display: flex; min-height: 0">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 19px">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Carrier Wave</div>
        <div style="font-size: 22px; line-height: 24px; color: #606060; white-space: nowrap">Beacon · Signal</div>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 19px">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Café Del Mar</div>
        <div style="font-size: 22px; line-height: 24px; color: #606060; white-space: nowrap">Aurora Lane · First Light</div>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 19px">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Ember</div>
        <div style="font-size: 22px; line-height: 24px; color: #606060; white-space: nowrap">The Cinders · Now 7</div>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 19px; color: #ffffff; text-shadow: 0 1px 0 rgba(0,0,0,.3); background: linear-gradient(#6db3f5, #2f80e0 50%, #1b62cf 51%, #1858c8)">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Harbour Lights</div>
        <div style="font-size: 22px; line-height: 24px; color: #ffffff; white-space: nowrap">Aurora Lane · First Light</div>
      </div>
      <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 19px">
        <div style="font-size: 26px; line-height: 29px; white-space: nowrap">Hit A</div>
        <div style="font-size: 22px; line-height: 24px; color: #606060; white-space: nowrap">Zed Zed · Hit A</div>
      </div>
    </div>
    <div aria-hidden="true" style="width: 14px; flex: none; box-sizing: border-box; padding: 3px; background: linear-gradient(90deg, #d5d8dc, #f1f2f4); border-left: 1px solid #b9bdc4">
      <div style="margin-top: 150px; height: 70px; border-radius: 4px; background: linear-gradient(90deg, #8fc3f6, #2f80e0 60%, #1858c8)"></div>
    </div>
  </div>
</div>
</body>
</html>
