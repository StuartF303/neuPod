<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Modern Cover Flow</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; color: #f0f0f0; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden; background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.6)), radial-gradient(100% 90% at 50% 35%, rgba(233,196,106,.5), rgba(233,196,106,0) 60%), radial-gradient(120% 110% at 50% 110%, rgba(120,82,36,.8), rgba(90,62,27,0) 65%), #050608">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: rgba(10,10,12,.5); border-bottom: 1px solid rgba(255,255,255,.1)">
    <div style="display: flex; align-items: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="2" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg></div>
    <div style="font-size: 26px">Cover Flow</div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid rgba(255,255,255,.6); border-radius: 8px"><div style="width: 78%; height: 100%; border-radius: 4px; background: linear-gradient(#8cecb4, #30b870)"></div></div>
      <div style="width: 3px; height: 9px; background: rgba(255,255,255,.6); border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; position: relative">
    <div role="img" aria-label="Five album covers in a row, the centre one largest, placeholders" style="position: absolute; left: 0; top: 30px; width: 600px; height: 220px">
      <div style="position: absolute; left: -34px; top: 60px; width: 100px; height: 100px; border-radius: 12px; opacity: .6; background: linear-gradient(135deg, #2b2d42 50%, #8d99ae 50%)"></div>
      <div style="position: absolute; right: -34px; top: 60px; width: 100px; height: 100px; border-radius: 12px; opacity: .6; background: linear-gradient(135deg, #6d597a 50%, #eaac8b 50%)"></div>
      <div style="position: absolute; left: 46px; top: 35px; width: 150px; height: 150px; border-radius: 16px; opacity: .85; background: linear-gradient(135deg, #3d405b 50%, #81b29a 50%); box-shadow: 0 10px 24px rgba(0,0,0,.55)"></div>
      <div style="position: absolute; right: 46px; top: 35px; width: 150px; height: 150px; border-radius: 16px; opacity: .85; background: linear-gradient(135deg, #264653 50%, #e76f51 50%); box-shadow: 0 10px 24px rgba(0,0,0,.55)"></div>
      <div style="position: absolute; left: 190px; top: 0; width: 220px; height: 220px; border-radius: 20px; background: linear-gradient(135deg, #5a3e1b 50%, #e9c46a 50%); box-shadow: 0 18px 40px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.25)"></div>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 272px; text-align: center">
      <div style="font-size: 38px; line-height: 41px">Orbital 2</div>
      <div style="margin-top: 4px; font-size: 26px; line-height: 29px; color: #d8d8d8">Orbital</div>
      <div style="margin-top: 2px; font-size: 22px; line-height: 24px; color: #b8b8b8">1993 · 10 songs</div>
    </div>
  </div>
</div>
</body>
</html>
