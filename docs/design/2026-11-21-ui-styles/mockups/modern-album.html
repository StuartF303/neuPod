<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Modern album</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; color: #f0f0f0; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden; background: linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.6)), radial-gradient(110% 90% at 15% 20%, rgba(233,196,106,.5), rgba(233,196,106,0) 60%), radial-gradient(120% 110% at 90% 100%, rgba(120,82,36,.8), rgba(90,62,27,0) 65%), #050608">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: rgba(10,10,12,.5); border-bottom: 1px solid rgba(255,255,255,.1)">
    <div style="display: flex; align-items: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="2" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg></div>
    <div style="font-size: 26px">Orbital 2</div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid rgba(255,255,255,.6); border-radius: 8px"><div style="width: 78%; height: 100%; border-radius: 4px; background: linear-gradient(#8cecb4, #30b870)"></div></div>
      <div style="width: 3px; height: 9px; background: rgba(255,255,255,.6); border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="height: 121px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 18px; padding: 0 19px">
    <div role="img" aria-label="Album art placeholder" style="width: 96px; height: 96px; flex: none; border-radius: 14px; background: linear-gradient(135deg, #5a3e1b 50%, #e9c46a 50%); box-shadow: 0 10px 24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2)"></div>
    <div style="min-width: 0">
      <div style="font-size: 38px; line-height: 41px; white-space: nowrap">Orbital</div>
      <div style="margin-top: 4px; font-size: 22px; line-height: 24px; color: #c8c8c8">1993 · 10 songs</div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 6px; font-size: 26px; background: rgba(0,0,0,.42); border-top: 1px solid rgba(255,255,255,.08)">
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 13px"><span style="width: 30px; text-align: right; font-size: 22px; color: #b0b0b0">1</span><span>Time Becomes</span></div>
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 13px; border-radius: 14px; color: #ffffff; background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,0) 55%), #8a5a12; box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28)"><span style="width: 30px; text-align: right; font-size: 22px">2</span><span>Planet of the Shapes</span></div>
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 13px"><span style="width: 30px; text-align: right; font-size: 22px; color: #b0b0b0">3</span><span>Lush 3-1</span></div>
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 13px"><span style="width: 30px; text-align: right; font-size: 22px; color: #b0b0b0">4</span><span>Lush 3-2</span></div>
    <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 13px"><span style="width: 30px; text-align: right; font-size: 22px; color: #b0b0b0">5</span><span style="white-space: nowrap">Impact (The Earth Is Burning)</span></div>
  </div>
</div>
</body>
</html>
