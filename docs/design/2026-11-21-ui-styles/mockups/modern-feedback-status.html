<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Modern feedback in the status bar</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; color: #f0f0f0; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden; background: linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.5)), radial-gradient(120% 90% at 85% 20%, rgba(217,115,78,.45), rgba(217,115,78,0) 60%), radial-gradient(110% 100% at 10% 100%, rgba(30,70,110,.75), rgba(22,50,79,0) 65%), #050608">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: auto 1fr auto; column-gap: 14px; align-items: center; padding: 0 19px; background: rgba(10,10,12,.5); border-bottom: 1px solid rgba(255,255,255,.1)">
    <div style="display: flex; align-items: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#f0f0f0"><rect x="5" y="3" width="5" height="18" rx="1.5"/><rect x="14" y="3" width="5" height="18" rx="1.5"/></svg></div>
    <div style="font-size: 26px; text-align: center; white-space: nowrap">Headphones unplugged</div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid rgba(255,255,255,.6); border-radius: 8px"><div style="width: 78%; height: 100%; border-radius: 4px; background: linear-gradient(#8cecb4, #30b870)"></div></div>
      <div style="width: 3px; height: 9px; background: rgba(255,255,255,.6); border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 6px; background: rgba(0,0,0,.42)">
    <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px">
      <div style="font-size: 26px; line-height: 29px">Carrier Wave</div>
      <div style="font-size: 22px; line-height: 24px; color: #b0b0b0">Beacon · Signal</div>
    </div>
    <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px">
      <div style="font-size: 26px; line-height: 29px">Café Del Mar</div>
      <div style="font-size: 22px; line-height: 24px; color: #b0b0b0">Aurora Lane · First Light</div>
    </div>
    <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px">
      <div style="font-size: 26px; line-height: 29px">Ember</div>
      <div style="font-size: 22px; line-height: 24px; color: #b0b0b0">The Cinders · Now 7</div>
    </div>
    <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px; border-radius: 16px; color: #ffffff; background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,0) 55%), #b8502c; box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28)">
      <div style="font-size: 26px; line-height: 29px">Harbour Lights</div>
      <div style="font-size: 22px; line-height: 24px">Aurora Lane · First Light</div>
    </div>
    <div style="height: 75px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 13px">
      <div style="font-size: 26px; line-height: 29px">Hit A</div>
      <div style="font-size: 22px; line-height: 24px; color: #b0b0b0">Zed Zed · Hit A</div>
    </div>
  </div>
</div>
</body>
</html>
