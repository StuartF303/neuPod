<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Modern feedback panel</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; color: #f0f0f0; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden; background: linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.5)), radial-gradient(120% 90% at 85% 20%, rgba(217,115,78,.45), rgba(217,115,78,0) 60%), radial-gradient(110% 100% at 10% 100%, rgba(30,70,110,.75), rgba(22,50,79,0) 65%), #050608">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; background: rgba(10,10,12,.5); border-bottom: 1px solid rgba(255,255,255,.1)">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #b8b8b8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="2" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg></div>
    <div style="font-size: 26px">Bluetooth</div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5aa2ff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 9px"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid rgba(255,255,255,.6); border-radius: 8px"><div style="width: 78%; height: 100%; border-radius: 4px; background: linear-gradient(#8cecb4, #30b870)"></div></div>
      <div style="width: 3px; height: 9px; background: rgba(255,255,255,.6); border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; position: relative">
    <div aria-hidden="true" style="display: flex; flex-direction: column; padding: 0 6px; font-size: 26px">
      <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Bluetooth</span><span style="font-size: 22px; color: #b0b0b0">On</span></div>
      <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Audio output</span><span style="font-size: 22px; color: #b0b0b0">Auto</span></div>
      <div style="height: 56px; display: flex; align-items: center; padding: 0 13px"><span>Devices</span></div>
      <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 13px"><span>Absolute volume</span><span style="font-size: 22px; color: #b0b0b0">On</span></div>
    </div>
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6)">
      <div style="width: 452px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 16px; background: rgba(28,28,32,.92); border: 1px solid rgba(255,255,255,.16); border-radius: 22px; box-shadow: 0 18px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14)">
        <div style="font-size: 26px; line-height: 29px; text-align: center">Paired, but not saved</div>
        <div style="font-size: 22px; line-height: 28px; color: #c8c8c8; text-align: center">The card is read-only, so this headset will be forgotten when the player switches off.</div>
        <div style="margin-top: 4px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 14px; font-size: 26px; color: #ffffff; background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,0) 55%), #b8502c; box-shadow: inset 0 1px 0 rgba(255,255,255,.28)">OK</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
