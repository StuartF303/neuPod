<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neuPod mock-up: Classic Cover Flow</title>
<!-- 600x450 px. Design mock-up, not firmware output. Font: Montserrat Medium. Icons: Lucide (ISC). Album art squares are placeholders. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 600px; height: 450px; box-sizing: border-box; display: flex; flex-direction: column; background: #000000; color: #ffffff; font-family: Montserrat, system-ui, sans-serif; font-weight: 500; overflow: hidden">
  <div style="height: 45px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 19px; color: #181818; background: linear-gradient(#fdfdfd, #dcdfe3 50%, #c6cad0 51%, #b6bbc2); border-bottom: 1px solid #8c9199">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 22px; color: #3a3d42"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#3a3d42"><path d="M6 3l14 9-14 9z"/></svg></div>
    <div style="font-size: 26px">Cover Flow</div>
    <div style="display: flex; justify-content: flex-end; align-items: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3d42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <div style="width: 44px; height: 22px; box-sizing: border-box; padding: 2px; border: 2px solid #5d626a; border-radius: 4px; background: #f4f5f6"><div style="width: 78%; height: 100%; border-radius: 1px; background: linear-gradient(#c9f5a3, #63c62f 45%, #3f9c1c 55%, #58b82a)"></div></div>
      <div style="width: 4px; height: 10px; background: #5d626a; border-radius: 0 2px 2px 0"></div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; position: relative; background: linear-gradient(#000000 55%, #1a1c20)">
    <div role="img" aria-label="Five album covers in a row, the centre one facing forward, placeholders" style="position: absolute; left: 0; top: 34px; width: 600px; height: 270px; perspective: 700px">
      <div style="position: absolute; left: 6px; top: 22px; width: 156px; transform: rotateY(58deg); transform-origin: left center">
        <div style="height: 156px; background: linear-gradient(135deg, #2b2d42 50%, #8d99ae 50%)"></div>
        <div style="margin-top: 2px; height: 50px; opacity: .3; background: linear-gradient(135deg, #8d99ae 50%, #2b2d42 50%); -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent)"></div>
      </div>
      <div style="position: absolute; left: 84px; top: 22px; width: 156px; transform: rotateY(58deg); transform-origin: left center">
        <div style="height: 156px; background: linear-gradient(135deg, #3d405b 50%, #81b29a 50%)"></div>
        <div style="margin-top: 2px; height: 50px; opacity: .3; background: linear-gradient(135deg, #81b29a 50%, #3d405b 50%); -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent)"></div>
      </div>
      <div style="position: absolute; right: 6px; top: 22px; width: 156px; transform: rotateY(-58deg); transform-origin: right center">
        <div style="height: 156px; background: linear-gradient(135deg, #6d597a 50%, #eaac8b 50%)"></div>
        <div style="margin-top: 2px; height: 50px; opacity: .3; background: linear-gradient(135deg, #eaac8b 50%, #6d597a 50%); -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent)"></div>
      </div>
      <div style="position: absolute; right: 84px; top: 22px; width: 156px; transform: rotateY(-58deg); transform-origin: right center">
        <div style="height: 156px; background: linear-gradient(135deg, #264653 50%, #e76f51 50%)"></div>
        <div style="margin-top: 2px; height: 50px; opacity: .3; background: linear-gradient(135deg, #e76f51 50%, #264653 50%); -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent)"></div>
      </div>
      <div style="position: absolute; left: 200px; top: 0; width: 200px">
        <div style="height: 200px; background: linear-gradient(135deg, #5a3e1b 50%, #e9c46a 50%); box-shadow: 0 0 24px rgba(0,0,0,.8)"></div>
        <div style="margin-top: 2px; height: 60px; opacity: .35; background: linear-gradient(135deg, #e9c46a 50%, #5a3e1b 50%); -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent)"></div>
      </div>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 322px; text-align: center">
      <div style="font-size: 26px; line-height: 29px">Orbital 2</div>
      <div style="font-size: 22px; line-height: 24px; color: #b8b8b8">Orbital</div>
    </div>
  </div>
</div>
</body>
</html>
