<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="neuPod power tree: USB-C and LiPo into the charger, then the rails that feed each block">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #1d1d1b; }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 10.5px; fill: #5b5a56; }
    .box { fill: #ffffff; stroke: #6b6a66; stroke-width: 1.25; rx: 8; }
    .src { fill: #fdf1ec; stroke: #c8372d; stroke-width: 1.5; rx: 8; }
    .rail { fill: #eaf1fb; stroke: #2b6cb0; stroke-width: 1.5; rx: 8; }
    .w { stroke: #6b6a66; stroke-width: 1.25; fill: none; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker></defs>
  <text x="20" y="26" class="t">neuPod power tree (final board)</text>

  <rect x="20" y="60" width="150" height="48" class="src"/>
  <text x="95" y="80" text-anchor="middle" class="t">USB-C VBUS</text>
  <text x="95" y="98" text-anchor="middle" class="s">5 V · 5.1 kΩ CC pulldowns</text>

  <rect x="20" y="140" width="150" height="48" class="src"/>
  <text x="95" y="160" text-anchor="middle" class="t">LiPo cell</text>
  <text x="95" y="178" text-anchor="middle" class="s">2,000–3,000 mAh · PCM</text>

  <rect x="20" y="220" width="150" height="48" class="src" stroke-dasharray="4 3"/>
  <text x="95" y="240" text-anchor="middle" class="t">Qi receiver (option)</text>
  <text x="95" y="258" text-anchor="middle" class="s">BQ51013B · non-metal back</text>

  <rect x="230" y="110" width="170" height="100" class="box"/>
  <text x="315" y="134" text-anchor="middle" class="t">Charger + power path</text>
  <text x="315" y="152" text-anchor="middle" class="s">BQ25895 / BQ24074 class</text>
  <text x="315" y="168" text-anchor="middle" class="s">runs from USB while charging</text>
  <text x="315" y="184" text-anchor="middle" class="s">SYS node 3.4–4.2 V</text>
  <text x="315" y="200" text-anchor="middle" class="s">MAX17048 gauge on I²C</text>

  <rect x="460" y="50" width="130" height="40" class="rail"/>
  <text x="525" y="74" text-anchor="middle" class="t">3.3 V buck</text>
  <rect x="460" y="110" width="130" height="40" class="rail"/>
  <text x="525" y="134" text-anchor="middle" class="t">Analogue LDO</text>
  <rect x="460" y="170" width="130" height="40" class="rail"/>
  <text x="525" y="194" text-anchor="middle" class="t">LED boost</text>
  <rect x="460" y="230" width="130" height="40" class="rail" stroke-dasharray="4 3"/>
  <text x="525" y="254" text-anchor="middle" class="t">AMOLED PMIC (opt.)</text>

  <text x="610" y="66" class="s">MCU · radio · microSD · wheel</text>
  <text x="610" y="80" class="s">(load switches on SD/DAC/radio)</text>
  <text x="610" y="126" class="s">DAC / ADC analogue</text>
  <text x="610" y="140" class="s">low-noise, own LDO</text>
  <text x="610" y="186" class="s">TFT backlight 4× WLED</text>
  <text x="610" y="200" class="s">~70 mA, PWM dimmed</text>
  <text x="610" y="246" class="s">AVDD ~4.6 V / ELVSS</text>
  <text x="610" y="260" class="s">only if the AMOLED is fitted</text>

  <path d="M170 84 H200 V140 H230" class="w" marker-end="url(#a)"/>
  <path d="M170 164 H230" class="w" marker-end="url(#a)"/>
  <path d="M170 244 H200 V188 H230" class="w" marker-end="url(#a)"/>
  <path d="M400 160 H430 V70 H460" class="w" marker-end="url(#a)"/>
  <path d="M400 160 H430 V130 H460" class="w" marker-end="url(#a)"/>
  <path d="M400 160 H430 V190 H460" class="w" marker-end="url(#a)"/>
  <path d="M400 160 H430 V250 H460" class="w" marker-end="url(#a)"/>

  <text x="20" y="305" class="s">Standby target &lt;0.5 mA: everything but the MCU's dormant domain and the gauge is switched off; wake from hold switch or wheel.</text>
</svg>
